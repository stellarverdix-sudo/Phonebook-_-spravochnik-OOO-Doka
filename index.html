    <!-- Intercept Console Output for Pro Studio View -->
    <script>
      (function(){
        function send(type, args) {
          try {
            const msg = Array.from(args).map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
            window.parent.postMessage({ type: 'CONSOLE_LOG', level: type, text: msg }, '*');
          } catch(e){}
        }
        const oLog = console.log, oErr = console.error, oWarn = console.warn;
        console.log = function(){ send('info', arguments); oLog.apply(console, arguments); };
        console.error = function(){ send('error', arguments); oErr.apply(console, arguments); };
        console.warn = function(){ send('warn', arguments); oWarn.apply(console, arguments); };
        window.onerror = function(msg, url, line){ send('error', ['Error [L:' + line + ']: ' + msg]); return false; };
      })();
    </script>

function formatPhoneNumber(raw) {
  const d = raw.replace(/\D/g, '');
  let digits = d;
  if (d.startsWith('80')) digits = d.substring(2);
  else if (d.startsWith('375')) digits = d.substring(3);
  
  if (digits.length === 9) {
    const code = digits.substring(0, 2);
    const p1 = digits.substring(2, 5);
    const p2 = digits.substring(5, 7);
    const p3 = digits.substring(7, 9);
    return {
      display: `+375 (${code}) ${p1}-${p2}-${p3}`,
      tel: `+375${digits}`
    };
  }
  return {
    display: raw.startsWith('+375') ? raw : `+375 ${raw}`,
    tel: `+375${digits}`
  };
}

function getAllContacts() {
  const partners = getSavedPartners();
  return [...staffData, ...partners];
}

function switchCategory(cat) {
  activeCategory = cat;
  document.getElementById('tabEmployees').classList.toggle('active', cat === 'all');
  document.getElementById('tabStaff').classList.toggle('active', cat === 'staff');
  document.getElementById('tabPartners').classList.toggle('active', cat === 'partners');
  populateDeptDropdown();
  render();
}

function populateDeptDropdown() {
  const contacts = getAllContacts().filter(c => {
    if (activeCategory === 'staff') return c.category === 'staff';
    if (activeCategory === 'partners') return c.category === 'partner';
    return true;
  });

  const depts = [...new Set(contacts.map(e => e.dept))].sort((a, b) => a.localeCompare(b, 'ru'));
  deptSelect.innerHTML = '<option value="">Все подразделения / Адреса</option>';
  depts.forEach(dept => {
    const opt = document.createElement('option');
    opt.value = dept;
    opt.textContent = dept;
    deptSelect.appendChild(opt);
  });
}

  addModal.style.display = 'flex';

  addModal.style.display = 'none';
  document.getElementById('newContactName').value = '';
  document.getElementById('newContactRole').value = '';

function saveNewPartner() {
  const name = document.getElementById('newContactName').value.trim();
  const role = document.getElementById('newContactRole').value.trim() || 'Поставщик / Клиент';
  const dept = document.getElementById('newContactDept').value.trim() || 'Адрес не указан';
  const rawPhone = document.getElementById('newContactPhone').value.trim();

  if (!name || !rawPhone) {
    alert('Пожалуйста, заполните как минимум имя и номер телефона.');
    return;
  }

  const { display, tel } = formatPhoneNumber(rawPhone);
  const partners = getSavedPartners();
  const nextId = 100 + partners.length + 1;

  partners.push({
    id: nextId,
    name,
    role,
    dept,
    phone: display,
    tel,
    category: 'partner',
    isCustom: true
  });

  savePartnersToStorage(partners);
  closeAddModal();
  switchCategory('partners');
}

function deletePartner(id) {
  if (!confirm('Удалить этот контакт?')) return;
  let partners = getSavedPartners();
  partners = partners.filter(p => p.id !== id);
  savePartnersToStorage(partners);
  render();
}

// ЭКСПОРТ БАЗЫ ДАННЫХ В ЧИСТЫЙ JSON ФАЙЛ
function exportData() {
  const data = getAllContacts();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dateStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `contacts_backup_${dateStr}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ИМПОРТ И ВОССТАНОВЛЕНИЕ БАЗЫ ДАННЫХ
function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error();

      const partnersOnly = imported.filter(item => item.category === 'partner');
      if (partnersOnly.length > 0) {
        savePartnersToStorage(partnersOnly);
      }
      alert(`База успешно загружена! Найдено контактов: ${imported.length}`);
      populateDeptDropdown();
      render();
    } catch (err) {
      alert("Ошибка при чтении файла. Убедитесь, что выбран корректный файл резервной копии.");
    }
  };
  reader.readAsText(file);
}

function handleSort(key) {
  if (currentSort.key === key) {
    currentSort.asc = !currentSort.asc;
  } else {
    currentSort.key = key;
    currentSort.asc = true;
  }
  updateSortIcons();
  render();
}

function updateSortIcons() {
  ['id', 'name', 'role', 'dept', 'phone'].forEach(k => {
    const el = document.getElementById('sort-' + k);
    if (!el) return;
    if (currentSort.key === k) {
      el.textContent = currentSort.asc ? '▲' : '▼';
      el.style.color = 'var(--accent)';
    } else {
      el.textContent = '↕';
      el.style.color = 'var(--text-muted)';
    }
  });
}

function getFilteredData() {
  const query = searchInput.value.trim().toLowerCase();
  const selectedDept = deptSelect.value;
  const digitsOnly = query.replace(/\D/g, '');

  let list = getAllContacts().filter(c => {
    if (activeCategory === 'staff') return c.category === 'staff';
    if (activeCategory === 'partners') return c.category === 'partner';
    return true;
  });

  let filtered = list.filter(emp => {
    const matchDept = !selectedDept || emp.dept === selectedDept;
    if (!matchDept) return false;

    if (!query) return true;

    const matchText = 
      emp.name.toLowerCase().includes(query) ||
      emp.role.toLowerCase().includes(query) ||
      emp.dept.toLowerCase().includes(query);

    const matchPhone = digitsOnly.length > 0 && emp.tel.includes(digitsOnly);

    return matchText || matchPhone;
  });

  const { key, asc } = currentSort;
  filtered.sort((a, b) => {
    let res = 0;
    if (key === 'id') res = a.id - b.id;
    else res = a[key].localeCompare(b[key], 'ru');
    return asc ? res : -res;
  });

  return filtered;
}

          </a>
          ${delBtn}
        </div>
      </div>
    `;
  }).join('');
}

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.style.display = 'none';
  searchInput.focus();
  render();
});

searchInput.addEventListener('input', () => {
  clearBtn.style.display = searchInput.value ? 'block' : 'none';
  render();
});

deptSelect.addEventListener('change', render);

populateDeptDropdown();
updateSortIcons();
render();
</script>
