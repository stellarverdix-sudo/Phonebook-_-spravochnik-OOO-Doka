<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Телефонный справочник</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131d2e;
      --card-border: #1e2d42;
      --table-header: #101a29;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --phone-green: #34d399;
      --phone-bg: rgba(52, 211, 153, 0.1);
      --hover-row: #1b263b;
      --partner-accent: #f59e0b;
      --partner-bg: rgba(245, 158, 11, 0.12);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 span {
      color: var(--accent);
    }

    .badge-count {
      font-size: 0.85rem;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-weight: 600;
    }

    .tabs-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
    }

    .tab-btn.partner-tab.active {
      background: var(--partner-bg);
      border-color: var(--partner-accent);
      color: var(--partner-accent);
    }

    .actions-group {
      margin-left: auto;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-action {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: #283548;
      border-color: var(--accent);
    }

    .btn-add {
      background: #10b981;
      border-color: #059669;
      color: #fff;
    }

    .btn-add:hover {
      background: #059669;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 768px) {
      .controls {
        flex-direction: row;
      }
    }

    .search-wrapper {
      position: relative;
      flex: 2;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
      pointer-events: none;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #0b1320;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
    }

    select {
      flex: 1;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #0b1320;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    /* Аватарки */
    .avatar-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      border: 1.5px solid var(--card-border);
      flex-shrink: 0;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .avatar-wrapper.clickable {
      cursor: pointer;
    }

    .avatar-wrapper.clickable:hover {
      transform: scale(1.08);
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-initials {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--accent);
      text-transform: uppercase;
      user-select: none;
    }

    .partner-card .avatar-initials {
      color: var(--partner-accent);
    }

    /* Карточки для мобильных */
    .cards-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 600px) and (max-width: 900px) {
      .cards-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .contact-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .contact-card.partner-card {
      border-left: 4px solid var(--partner-accent);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-meta {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .card-name-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
    }

    .card-name {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      word-break: break-word;
    }

    .card-id {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 1px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .card-role {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 500;
    }

    .partner-card .card-role {
      color: var(--partner-accent);
    }

    .card-dept {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .card-phone-wrap {
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      gap: 8px;
    }

    .phone-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--phone-bg);
      color: var(--phone-green);
      border: 1px solid rgba(52, 211, 153, 0.25);
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .edit-btn, .del-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      padding: 0 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .del-btn {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    /* Таблица для ПК */
    .table-container {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    @media (min-width: 901px) {
      .cards-container { display: none; }
      .table-container { display: block; }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: var(--table-header);
      padding: 13px 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--card-border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover {
      color: var(--accent);
    }

    td {
      padding: 10px 16px;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
    }

    tr:hover td {
      background: var(--hover-row);
    }

    .table-user-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .name-cell {
      font-weight: 600;
      color: #fff;
    }

    .tag-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      margin-left: 6px;
    }

    .tag-partner {
      background: var(--partner-bg);
      color: var(--partner-accent);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .desktop-phone-link {
      color: var(--phone-green);
      text-decoration: none;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--phone-bg);
      display: inline-block;
      white-space: nowrap;
    }

    .table-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    /* Модальное окно */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .modal-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #0b1320;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .photo-upload-section {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0b1320;
      border: 1px dashed var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .photo-preview {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-file-upload {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--accent);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      width: fit-content;
      user-select: none;
      display: inline-block;
    }

    .btn-remove-photo {
      background: none;
      border: none;
      color: #f87171;
      font-size: 0.78rem;
      cursor: pointer;
      text-align: left;
      padding: 0;
      width: fit-content;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      border: none;
      color: #04121e;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Просмотр увеличенного фото (Lightbox) */
    .image-viewer-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(6px);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      flex-direction: column;
    }

    .image-viewer-content {
      position: relative;
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .image-viewer-img {
      max-width: 100%;
      max-height: 72vh;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      object-fit: contain;
    }

    .image-viewer-caption {
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .image-viewer-close {
      position: absolute;
      top: -42px;
      right: 0;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 1rem;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="title-row">
      <h1><span>⚡</span> Телефонный справочник</h1>
      <div class="badge-count" id="countBadge">Всего: 0</div>
    </div>

    <div class="tabs-bar">
      <button class="tab-btn active" id="tabEmployees" onclick="switchCategory('all')">👥 Все</button>
      <button class="tab-btn" id="tabStaff" onclick="switchCategory('staff')">🏭 Завод</button>
      <button class="tab-btn partner-tab" id="tabPartners" onclick="switchCategory('partners')">🤝 Поставщики/Клиенты</button>

      <div class="actions-group">
        <button class="btn-action" onclick="exportData()" title="Скачать данные контактов">💾 Скачать базу</button>
        <button class="btn-action" onclick="document.getElementById('importFile').click()" title="Восстановить базу из файла">📥 Загрузить базу</button>
        <button class="btn-action btn-add" onclick="openContactModal()">➕ Добавить</button>
      </div>
    </div>

    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">

    <div class="controls">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск по имени, адресу, должности, номеру...">
        <button class="clear-btn" id="clearBtn">✕</button>
      </div>
      <select id="deptSelect">
        <option value="">Все подразделения / Адреса</option>
      </select>
    </div>
  </header>

  <!-- Десктоп-таблица -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th onclick="handleSort('id')" style="width: 50px;">№ <span id="sort-id">↕</span></th>
          <th onclick="handleSort('name')">ФИО / Контакт <span id="sort-name">↕</span></th>
          <th onclick="handleSort('role')">Должность / Тип <span id="sort-role">↕</span></th>
          <th onclick="handleSort('dept')">Подразделение / Адрес <span id="sort-dept">↕</span></th>
          <th onclick="handleSort('phone')">Телефон <span id="sort-phone">↕</span></th>
          <th style="width: 80px; text-align: right;">Действия</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- Карточки для телефона -->
  <div class="cards-container" id="cardsContainer"></div>
  <div class="empty-state" id="emptyState" style="display: none;">По вашему запросу ничего не найдено</div>
</div>

<!-- Модальное окно (Добавление / Редактирование) -->
<div class="modal-overlay" id="contactModal">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">Добавить контакт</div>
    <input type="hidden" id="editContactId">

    <!-- Загрузка фото -->
    <div class="photo-upload-section">
      <div class="photo-preview" id="photoPreview">📷</div>
      <div class="photo-controls">
        <label class="btn-file-upload">
          📁 Загрузить фото
          <input type="file" id="photoFileInput" accept="image/*" style="display: none;" onchange="handlePhotoUpload(event)">
        </label>
        <button type="button" class="btn-remove-photo" id="btnRemovePhoto" style="display: none;" onclick="removeCurrentPhoto()">Удалить фото</button>
      </div>
    </div>
    <input type="hidden" id="photoBase64">

    <input type="text" class="modal-input" id="contactName" placeholder="ФИО или Организация (напр. Вадим)">
    <input type="text" class="modal-input" id="contactRole" placeholder="Должность или тип (напр. Поставщик / Клиент)">
    <input type="text" class="modal-input" id="contactDept" placeholder="Подразделение или адрес (напр. ул. Бадака д. 29)">
    <input type="text" class="modal-input" id="contactPhone" placeholder="Телефон (+375298276474)">

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeContactModal()">Отмена</button>
      <button class="btn-primary" onclick="saveContact()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Просмотр увеличенного фото -->
<div class="image-viewer-overlay" id="imageViewer" onclick="closeImageViewer()">
  <div class="image-viewer-content" onclick="event.stopPropagation()">
    <button class="image-viewer-close" onclick="closeImageViewer()">✕</button>
    <img id="viewerImg" class="image-viewer-img" src="" alt="Фото">
    <div id="viewerCaption" class="image-viewer-caption"></div>
  </div>
</div>

function getInitials(name) {
  if (!name) return '?';
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

function renderAvatar(item, size = 44) {
  if (item.photo) {
    return `
      <div class="avatar-wrapper clickable" style="width: ${size}px; height: ${size}px;" onclick="openImageViewerById(${item.id})" title="Нажмите для увеличения">
        <img src="${item.photo}" class="avatar-img" alt="${item.name}">
      </div>
    `;
  }
  return `
    <div class="avatar-wrapper" style="width: ${size}px; height: ${size}px;">
      <span class="avatar-initials">${getInitials(item.name)}</span>
    </div>
  `;
}

function openImageViewerById(id) {
  const list = getStoredContacts();
  const item = list.find(c => c.id === id);
  if (!item || !item.photo) return;
  viewerImg.src = item.photo;
  viewerCaption.textContent = item.name;
  imageViewer.style.display = 'flex';
}

function closeImageViewer() {
  imageViewer.style.display = 'none';
  viewerImg.src = '';
  viewerCaption.textContent = '';
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeImageViewer();
    closeContactModal();
  }
});

function formatPhoneNumber(raw) {
  const d = raw.replace(/\D/g, '');
  let digits = d;
  if (d.startsWith('80')) digits = d.substring(2);
  else if (d.startsWith('375')) digits = d.substring(3);
  
  if (digits.length === 9) {
    const code = digits.substring(0, 2);
    const p1 = digits.substring(2, 5);
    const p2 = digits.substring(5, 7);
    const p3 = digits.substring(7, 9);
    return {
      display: `+375 (${code}) ${p1}-${p2}-${p3}`,
      tel: `+375${digits}`
    };
  }
  return {
    display: raw.startsWith('+375') ? raw : `+375 ${raw}`,
    tel: `+375${digits}`
  };
}

  const contacts = getStoredContacts().filter(c => {
    if (activeCategory === 'staff') return c.category === 'staff';
    if (activeCategory === 'partners') return c.category === 'partner';
    return true;
  });

  const depts = [...new Set(contacts.map(e => e.dept))].sort((a, b) => a.localeCompare(b, 'ru'));
  deptSelect.innerHTML = '<option value="">Все подразделения / Адреса</option>';
  depts.forEach(dept => {
    const opt = document.createElement('option');
    opt.value = dept;
    opt.textContent = dept;
    deptSelect.appendChild(opt);
  });
}

// ПРЯМАЯ И БЕЗОПАСНАЯ ЗАГРУЗКА ФОТО
function handlePhotoUpload(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const preview = document.getElementById('photoPreview');
  preview.innerHTML = '⏳';

  const reader = new FileReader();
  reader.onerror = function() {
    alert("Ошибка при выборе файла.");
    preview.innerHTML = '📷';
  };

  reader.onload = function(e) {
    const tempImg = new Image();
    tempImg.onerror = function() {
      alert("Не удалось декодировать изображение.");
      preview.innerHTML = '📷';
    };
    tempImg.onload = function() {
      // Сжимаем пропорционально до легкого разрешения (до 200px)
      const maxDim = 200;
      let w = tempImg.width;
      let h = tempImg.height;

      if (w > h) {
        if (w > maxDim) {
          h = Math.round(h * (maxDim / w));
          w = maxDim;
        }
      } else {
        if (h > maxDim) {
          w = Math.round(w * (maxDim / h));
          h = maxDim;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(tempImg, 0, 0, w, h);

      // Получаем чистый base64
      const compressedData = canvas.toDataURL('image/jpeg', 0.82);
      setModalPhoto(compressedData);
    };
    tempImg.src = e.target.result;
  };

  reader.readAsDataURL(file);
}

function setModalPhoto(base64) {
  document.getElementById('photoBase64').value = base64 || '';
  const preview = document.getElementById('photoPreview');
  const btnRemove = document.getElementById('btnRemovePhoto');

  if (base64) {
    preview.innerHTML = `<img src="${base64}">`;
    btnRemove.style.display = 'block';
  } else {
    preview.innerHTML = '📷';
    btnRemove.style.display = 'none';
  }
}

function removeCurrentPhoto() {
  setModalPhoto('');
  document.getElementById('photoFileInput').value = '';
}

function openContactModal() {
  document.getElementById('modalTitle').textContent = 'Добавить контакт';
  document.getElementById('editContactId').value = '';
  document.getElementById('contactName').value = '';
  document.getElementById('contactRole').value = activeCategory === 'partners' ? 'Поставщик / Клиент' : '';
  document.getElementById('contactDept').value = '';
  document.getElementById('contactPhone').value = '';
  removeCurrentPhoto();
  contactModal.style.display = 'flex';
  document.getElementById('contactName').focus();
}

function editContact(id) {
  const list = getStoredContacts();
  const item = list.find(c => c.id === id);
  if (!item) return;

  document.getElementById('modalTitle').textContent = 'Редактировать контакт';
  document.getElementById('editContactId').value = item.id;
  document.getElementById('contactName').value = item.name;
  document.getElementById('contactRole').value = item.role;
  document.getElementById('contactDept').value = item.dept;
  document.getElementById('contactPhone').value = item.phone;
  setModalPhoto(item.photo || '');
  contactModal.style.display = 'flex';
  document.getElementById('contactName').focus();
}

function closeContactModal() {
  contactModal.style.display = 'none';
}

function saveContact() {
  const editId = document.getElementById('editContactId').value;
  const name = document.getElementById('contactName').value.trim();
  const role = document.getElementById('contactRole').value.trim() || 'Сотрудник / Партнер';
  const dept = document.getElementById('contactDept').value.trim() || 'Адрес не указан';
  const rawPhone = document.getElementById('contactPhone').value.trim();
  const photo = document.getElementById('photoBase64').value;

  if (!name || !rawPhone) {
    alert('Пожалуйста, укажите имя и номер телефона.');
    return;
  }

  const { display, tel } = formatPhoneNumber(rawPhone);
  let list = getStoredContacts();

  if (editId) {
    const idx = list.findIndex(c => c.id === Number(editId));
    if (idx !== -1) {
      list[idx].name = name;
      list[idx].role = role;
      list[idx].dept = dept;
      list[idx].phone = display;
      list[idx].tel = tel;
      list[idx].photo = photo;
    }
  } else {
    const maxId = list.reduce((m, c) => Math.max(m, c.id), 0);
    list.push({
      id: maxId + 1,
      name,
      role,
      dept,
      phone: display,
      tel,
      photo,
      category: activeCategory === 'staff' ? 'staff' : 'partner'
    });
  }

  saveContactsToStorage(list);
  closeContactModal();
  populateDeptDropdown();
  render();
}

function deleteContact(id) {
  if (!confirm('Вы уверены, что хотите удалить этот контакт?')) return;
  let list = getStoredContacts().filter(c => c.id !== id);
  saveContactsToStorage(list);
  populateDeptDropdown();
  render();
}

function exportData() {
  const data = getStoredContacts();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dateStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `contacts_backup_${dateStr}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error();
      saveContactsToStorage(imported);
      alert(`База успешно загружена! Записей: ${imported.length}`);
      populateDeptDropdown();
      render();
    } catch (err) {
      alert("Ошибка при чтении файла JSON.");
    }
  };
  reader.readAsText(file);
}

function handleSort(key) {
  if (currentSort.key === key) {
    currentSort.asc = !currentSort.asc;
  } else {
    currentSort.key = key;
    currentSort.asc = true;
  }
  updateSortIcons();
  render();
}

function updateSortIcons() {
  ['id', 'name', 'role', 'dept', 'phone'].forEach(k => {
    const el = document.getElementById('sort-' + k);
    if (!el) return;
    if (currentSort.key === k) {
      el.textContent = currentSort.asc ? '▲' : '▼';
      el.style.color = 'var(--accent)';
    } else {
      el.textContent = '↕';
      el.style.color = 'var(--text-muted)';
    }
  });
}

function getFilteredData() {
  const query = searchInput.value.trim().toLowerCase();
  const selectedDept = deptSelect.value;
  const digitsOnly = query.replace(/\D/g, '');

  let list = getStoredContacts().filter(c => {
    if (activeCategory === 'staff' && c.category !== 'staff') return false;
    if (activeCategory === 'partners' && c.category !== 'partner') return false;
    return true;
  });

  let filtered = list.filter(emp => {
    const matchDept = !selectedDept || emp.dept === selectedDept;
    if (!matchDept) return false;

    if (!query) return true;

    const matchText = 
      emp.name.toLowerCase().includes(query) ||
      emp.role.toLowerCase().includes(query) ||
      emp.dept.toLowerCase().includes(query);

    const matchPhone = digitsOnly.length > 0 && emp.tel.includes(digitsOnly);

    return matchText || matchPhone;
  });

  const { key, asc } = currentSort;
  filtered.sort((a, b) => {
    let res = 0;
    if (key === 'id') res = a.id - b.id;
    else res = a[key].localeCompare(b[key], 'ru');
    return asc ? res : -res;
  });

  return filtered;
}

function render() {
  const list = getFilteredData();
  const total = getStoredContacts().length;
  countBadge.textContent = `Показано: ${list.length} из ${total}`;

  if (list.length === 0) {
    emptyState.style.display = 'block';
    cardsContainer.style.display = 'none';
    tableBody.innerHTML = '';
    return;
  }

  emptyState.style.display = 'none';
  cardsContainer.style.display = 'grid';

  tableBody.innerHTML = list.map(item => {
    const isPartner = item.category === 'partner';
    const tag = isPartner ? '<span class="tag-badge tag-partner">Партнер</span>' : '';

    return `
      <tr>
        <td style="color: var(--text-muted); font-weight: 600;">${item.id}</td>
        <td>
          <div class="table-user-cell">
            ${renderAvatar(item, 36)}
            <span class="name-cell">${item.name} ${tag}</span>
          </div>
        </td>
        <td style="color: ${isPartner ? 'var(--partner-accent)' : '#cbd5e1'}">${item.role}</td>
        <td class="dept-cell">${item.dept}</td>
        <td>
          <a class="desktop-phone-link" href="tel:${item.tel}">📞 ${item.phone}</a>
        </td>
        <td>
          <div class="table-actions">
            <button onclick="editContact(${item.id})" style="background:none;border:none;cursor:pointer;font-size:1.1rem;" title="Редактировать">✏️</button>
            <button onclick="deleteContact(${item.id})" style="background:none;border:none;cursor:pointer;font-size:1.1rem;" title="Удалить">🗑</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');

  cardsContainer.innerHTML = list.map(item => {
    const isPartner = item.category === 'partner';
    const partnerClass = isPartner ? 'partner-card' : '';
    const tag = isPartner ? '<span class="tag-badge tag-partner">Партнер</span>' : '';

    return `
      <div class="contact-card ${partnerClass}">
        <div class="card-top">
          ${renderAvatar(item, 44)}
          <div class="card-meta">
            <div class="card-name-row">
              <span class="card-name">${item.name} ${tag}</span>
              <span class="card-id">#${item.id}</span>
            </div>
            <div class="card-role">${item.role}</div>
            <div class="card-dept">📍 ${item.dept}</div>
          </div>
        </div>
        <div class="card-phone-wrap">
          <a class="phone-btn" href="tel:${item.tel}">
            📞 ${item.phone}
          </a>
          <button class="edit-btn" onclick="editContact(${item.id})" title="Редактировать">✏️️</button>
          <button class="del-btn" onclick="deleteContact(${item.id})" title="Удалить">🗑</button>
        </div>
      </div>
    `;
  }).join('');
}

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.style.display = 'none';
  searchInput.focus();
  render();
});

searchInput.addEventListener('input', () => {
  clearBtn.style.display = searchInput.value ? 'block' : 'none';
  render();
});

deptSelect.addEventListener('change', render);

populateDeptDropdown();
updateSortIcons();
render();
</script>
